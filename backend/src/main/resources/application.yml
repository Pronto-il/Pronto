spring:
  application:
    name: pronto-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pronto}
    username: ${DB_USER:pronto}
    password: ${DB_PASSWORD:pronto}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway migrations are the single source of truth for schema — Hibernate only
      # validates that JPA entities match, it never auto-generates/alters the schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Character only, not the full lockup: at tab size (16-32px) the "pronto" wordmark is
         unreadable and the mascot beside it collapses to a few pixels, so the icon is the running
         professional on its own. `src/assets/pronto-mark.png` is that character reframed for a
         square canvas — see its derivation note in `src/assets/README.md`. Referenced through
         Vite's index.html asset pipeline, so it is hashed/emitted like every other asset. -->
    <link rel="icon" type="image/png" href="/src/assets/pronto-mark.png" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to anything other
         than 0 on a notched/home-indicator iPhone. The fixed bottom navigation and the floating
         toolbox both reserve space from those insets, so without this the nav sits under the home
         indicator and the toolbox can be dragged beneath it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Pronto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

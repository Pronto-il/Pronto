name: backend-ci

# Triggers are deliberately unfiltered by path. Path filters meant a docs-only change
# produced no check run at all, which would deadlock a required status check on a PR that
# never reports one (proven on commits 18585b4 and e253c23, both zero check runs). Running
# the suite on every change is the simple, reliable behaviour; it costs a few CI minutes on
# documentation commits and removes an entire class of merge deadlock.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    # Explicit job name. This string is what GitHub reports as the check-run name and what
    # branch protection lists as a required status check. Without it the job id ("build")
    # is used, and both workflows reported the same indistinguishable "build" context.
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pronto
          POSTGRES_USER: pronto
          POSTGRES_PASSWORD: pronto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pronto -d pronto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The migration check below compares against the base branch, which a depth-1 checkout
          # does not contain.
          fetch-depth: 0

      # Production MS5. Catches an edited already-applied migration here, where the cost is a red
      # check, rather than at startup in a deployed environment, where Flyway's own checksum refusal
      # arrives as an application that will not boot.
      - name: Flyway migrations are append-only
        run: bash backend/tools/check-migrations-append-only.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: pronto
          DB_USER: pronto
          DB_PASSWORD: pronto
        run: mvn -B clean verify

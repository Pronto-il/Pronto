spring:
  application:
    name: pronto-backend

  lifecycle:
    # Ceiling on `server.shutdown: graceful` below. 20s, not the 30s default, so that it stays
    # strictly INSIDE the ECS task definition's stopTimeout of 30s (infra/terraform/compute.tf).
    # Left at the default the two deadlines would coincide, and ECS would SIGKILL the container at
    # the same instant Spring was deciding to give up -- which is a race whose loser is an
    # in-flight request. Ten seconds of margin makes the ordering deterministic.
    timeout-per-shutdown-phase: 20s

  datasource:
    # Defaults deliberately mirror docker-compose.yml's published service, variable for
    # variable, so `docker compose up -d` followed by running this application connects with
    # no env vars set at all. See that file's header for why the host port is 5433 rather than
    # 5432 (a native Windows PostgreSQL service permanently owns 5432 on this project's
    # development machine). Every value stays env-overridable — .github/workflows/
    # backend-ci.yml sets all five explicitly and is unaffected by these defaults, and any
    # real deployment must do the same.
    #
    # DB_URL_PARAMS is the TLS seam, added by Production MS5. It is EMPTY by default, and that is
    # load-bearing rather than lazy: the local docker-compose PostgreSQL has no server certificate,
    # and pgjdbc's own default (sslmode=prefer) already negotiates TLS opportunistically wherever it
    # is offered. Baking a literal `?sslmode=disable` in for local development would be a real
    # downgrade of every environment that inherits this line, and baking `?sslmode=require` in would
    # break `docker compose up -d` on a fresh clone. An empty suffix changes nothing anywhere.
    #
    # Production sets DB_URL_PARAMS=?sslmode=require against an RDS instance whose parameter group
    # has rds.force_ssl=1 (infra/terraform/database.tf). Both halves are needed: force_ssl makes the
    # server refuse plaintext, sslmode=require makes the client refuse to silently fall back to it.
    # Note this is `require`, not `verify-full` — RDS presents an Amazon-issued certificate that the
    # JVM's default trust store does not contain, so verify-full needs the RDS CA bundle mounted and
    # a `sslrootcert=` pointing at it. That is a worthwhile hardening step and it is recorded in the
    # deployment runbook as post-1.0 work, not silently skipped.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pronto}${DB_URL_PARAMS:}
    username: ${DB_USER:pronto}
    # Local-dev-only default, matching docker-compose.yml's POSTGRES_PASSWORD — same
    # "obviously a local placeholder" convention as pronto.jwt.secret below. It was
    # previously empty, which made the documented `docker compose up -d` flow fail with a
    # SCRAM authentication error until the developer guessed an undocumented env var. This is
    # not a production secret: a deployment supplies DB_PASSWORD, and if it forgets, this
    # value fails to authenticate against a real database rather than granting anything.
    #
    # Production MS4 stopped relying on that last sentence being true. "A real database will not
    # accept it" is a property of the database, not of this application, and it stops holding the
    # moment somebody provisions RDS with the same convenience credentials used locally.
    # common.config.DatabaseConfigStartupGuard now refuses to start a production-like environment
    # with this value, with an empty password, or against a localhost database host.
    password: ${DB_PASSWORD:pronto}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway migrations are the single source of truth for schema — Hibernate only
      # validates that JPA entities match, it never auto-generates/alters the schema.
      # This is a Spring property like any other, so an environment could override it to
      # create/create-drop/update. DatabaseConfigStartupGuard refuses those in production-like
      # environments, along with spring.flyway.enabled=false and spring.flyway.clean-disabled=false.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      # §2.3's recommended 8 MB cap on any single uploaded file (image or, per the
      # backend registration flow separation task, a Professional's verification
      # document). Exceeding this throws MaxUploadSizeExceededException, mapped to 413
      # IMAGE_TOO_LARGE by common.exception.GlobalExceptionHandler. See
      # docs/architecture/api-contract-issues.md §2.3.
      max-file-size: 8MB
      # POST /api/auth/register can carry up to two files in one request (required
      # verification document + optional profile photo) plus the JSON data part, so the
      # whole-request cap must exceed the single-file cap above -- 20MB comfortably
      # covers two 8MB files with headroom for multipart overhead.
      max-request-size: 20MB

pronto:
  # Milestone 7 hardening (docs/architecture/hardening-plan.md §5.1). This codebase has no
  # Spring profiles configured anywhere (single application.yml, no spring.profiles.active
  # usage) — this one property is a deliberately minimal substitute, not the start of a
  # profile system. Default "local" covers every local/QA/dev startup path today (none of
  # them set PRONTO_ENVIRONMENT). A real deployment sets this to anything other than
  # "local" (e.g. "production") as part of its own config, alongside a real JWT_SECRET.
  # Consumed through common.config.ProntoEnvironment by every startup guard in the codebase, which
  # treats "local", "demo" and "test" as non-production and EVERY other value -- including every
  # value nobody has thought of yet -- as production. As of Production MS4 the full set is:
  # auth.security.JwtSecretStartupGuard, auth.config.ProductionHardeningStartupGuard,
  # auth.config.ProviderModeStartupGuard, auth.config.CorsOriginStartupGuard,
  # ai.config.AiModeStartupGuard, storage.config.StorageModeStartupGuard,
  # common.config.DatabaseConfigStartupGuard and demo.DemoDataStartupGuard. The complete list of
  # variables a production deployment must set is in
  # docs/production-roadmap/reports/prod-MS4-report.md.
  environment: ${PRONTO_ENVIRONMENT:local}

  demo-data:
    # TEST/DEMO synthetic dataset (com.pronto.demo). Off by default and off in every
    # environment except a deliberately-configured TEST/DEMO one; a normal startup never
    # touches demo data.
    #
    # There is no separate TEST/DEMO datasource: the environment is chosen with the same five
    # DB_* variables above (point DB_NAME at the demo database). A second datasource block
    # would mean two connections and a runtime switch between them, which is exactly the
    # environment-conditional this feature exists to avoid. See DemoDataProperties.
    #
    # off | seed | reset
    #   off    do nothing (default)
    #   seed   build the dataset unless demo accounts already exist -- safe to leave on
    #   reset  TRUNCATE every application table in the demo database, then rebuild
    mode: ${DEMO_DATA_MODE:off}
    # The ONLY database demo data may be written to, compared at startup against
    # SELECT current_database(). Seeding while connected to anything else is a startup
    # failure, which is what stops a forgotten DB_NAME from writing synthetic professionals
    # into the developer's LOCAL database (or, with mode=reset, truncating it). A production
    # deployment leaves this alone; if it is ever mispointed at a database with this name,
    # the same guard refuses to start.
    database-name: ${DEMO_DATA_DATABASE_NAME:pronto_demo}
    # Shared login password for every seeded demo account, so any of them can be demonstrated.
    # Not a production credential and not a secret: it only unlocks synthetic accounts on
    # @demo.pronto.invalid addresses, in a database the guard has already proven is the demo
    # one. Same obviously-a-placeholder convention as pronto.jwt.secret -- override via
    # DEMO_DATA_PASSWORD for any TEST/DEMO instance reachable outside the team.
    password: ${DEMO_DATA_PASSWORD:ProntoDemo!2026}

  cors:
    # Browser CORS allow-list for /api/**, see auth.config.SecurityConfig's Javadoc on
    # corsConfigurationSource(). Comma-separated list of origins; Spring's relaxed
    # binding splits a single comma-separated env/default string into List<String>
    # automatically, so a single default origin needs no bracket/YAML-list syntax.
    # Default covers the Vite dev server. Override via CORS_ALLOWED_ORIGINS in any
    # non-local deployment -- auth.config.CorsOriginStartupGuard refuses to start a production-like
    # environment whose allow-list is empty, contains a wildcard, names localhost/127.0.0.1, or uses
    # a non-HTTPS scheme (every JWT this API issues travels from that origin).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    # Local-dev-only default. This is NOT production-safe — every real deployment must
    # override this via the JWT_SECRET env var with a securely generated, kept-secret
    # value (must be >= 32 bytes for HS256). See docs/architecture/api-contract.md §3.1.
    # Enforced at startup, not just documented here: auth.security.JwtSecretStartupGuard
    # refuses to start if pronto.environment != local and this is still the placeholder
    # below -- and, as of Production MS4, if the override is empty or shorter than 32
    # characters. Without that last check jjwt's own Keys.hmacShaKeyFor still refused the
    # key, but from inside a WeakKeyException that named no environment variable.
    secret: ${JWT_SECRET:local-dev-only-insecure-jwt-secret-key-please-override-via-JWT_SECRET-env-var-before-any-real-deployment}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

  storage:
    # local | s3. Default local — zero AWS credentials needed, matches M1's
    # zero-external-dependency default. See docs/architecture/api-contract-issues.md §3.2.
    #
    # Production MS4: storage.config.StorageModeStartupGuard refuses mode=local in any
    # production-like environment. Issue photos and professional verification documents would be
    # written to the container's own filesystem and lost on the next deploy, while every upload
    # reported success -- silent, permanent loss of the identity evidence marketplace eligibility is
    # decided on. The same guard requires a bucket and region whenever mode=s3.
    mode: ${STORAGE_MODE:local}
    # How long a presigned/signed image URL stays valid from the moment it's minted (backend
    # MS9, docs/architecture/backend-ms9-presigned-image-urls-design.md §6). One value, one
    # source of truth: local mode's HMAC-signed query-string URLs and S3 mode's
    # GetObjectPresignRequest.signatureDuration both read this same property.
    presigned-url-ttl-seconds: ${STORAGE_PRESIGNED_URL_TTL_SECONDS:300}
    # Base URL this backend is reachable at. Narrowed in scope by MS9 (§10): only local mode
    # still uses this, to build GET /api/storage/images/{key}?expires=...&sig=... — s3 mode's
    # presigned URLs come entirely from S3Presigner and point directly at the S3 endpoint,
    # never at this backend. Override in any non-local deployment via STORAGE_PUBLIC_BASE_URL.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:${server.port:8080}}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./data/uploads}
      # Local-dev-only default, NOT production-safe — same "obviously a placeholder, loudly
      # insecure" convention as pronto.jwt.secret above. Every real deployment running
      # STORAGE_MODE=local must override this via the STORAGE_LOCAL_HMAC_SECRET env var.
      # Production MS4 enforces that: StorageModeStartupGuard refuses this placeholder (and an
      # empty or under-32-character override) in EVERY environment except local, including demo
      # and test -- the same non-local rule the JWT secret gets, for the same reason. A publicly
      # known signing key is directly exploitable by anyone who can reach the instance.
      # Signs/verifies the expires/sig query parameters on GET /api/storage/images/** — a
      # dedicated secret, deliberately not shared with JWT_SECRET (different blast radius: this
      # one authorizes a single short-lived image-URL grant, not a whole session). See
      # docs/architecture/backend-ms9-presigned-image-urls-design.md §3.
      hmac-secret: ${STORAGE_LOCAL_HMAC_SECRET:local-dev-only-insecure-hmac-secret-please-override-via-STORAGE_LOCAL_HMAC_SECRET-env-var-before-any-real-deployment}
    # Only used when mode=s3, see storage.client.S3StorageClient's Javadoc.
    bucket: ${STORAGE_S3_BUCKET:}
    region: ${STORAGE_S3_REGION:us-east-1}

  ai:
    # mock | openai. Default mock — no real OpenAI key needed. See
    # docs/architecture/api-contract-issues.md §3.1.
    #
    # Production MS4: ai.config.AiModeStartupGuard refuses mode=mock in any production-like
    # environment, and refuses mode=openai with no OPENAI_API_KEY/OPENAI_MODEL in ANY environment.
    # The mock is a Hebrew keyword table that answers every request in the right shape, so the
    # routing pipeline, the clarification flow and the telemetry all behave normally while every
    # category on every order is fiction. It prefixes its customer-visible strings with [מוק],
    # which helps manual QA; the routing DECISION carries no such marker -- it is a category id on
    # an order.
    mode: ${AI_MODE:mock}

    # Whether the post-creation job also records what the AI independently routes a created
    # issue to (issues.service.IssueBriefService). Pure telemetry — it never changes
    # issues.category_id — but it costs a second model call on EVERY created issue.
    #
    # Off by default: paying that on every issue is not justified yet. Accuracy is measured by
    # the labelled evaluation harness (backend src/test/java/com/pronto/ai/eval); this only
    # adds a production drift signal ("how often does the model disagree with the category the
    # customer confirmed") on top. Switch it on deliberately when that signal is wanted.
    record-final-classification: ${AI_RECORD_FINAL_CLASSIFICATION:false}

    routing:
      # Every threshold the routing decision depends on. These are starting points to be
      # tuned against the labelled evaluation harness, NOT measured optima — see
      # ai.decision.RoutingProperties. Raising max-clarification-questions trades customer
      # friction for accuracy; the other three trade clarification rate against the risk of
      # committing to a close call.
      #
      # Hard cap on questions per issue, across all rounds. This is what makes an endless
      # clarification loop structurally impossible.
      max-clarification-questions: ${AI_MAX_CLARIFICATION_QUESTIONS:2}
      # Below this the top candidate is not self-evidently safe on its own. Never sufficient
      # on its own to ask a question — see RoutingDecisionPolicy's Javadoc.
      min-confidence: ${AI_MIN_CONFIDENCE:0.70}
      # Minimum gap between the top two candidates before they count as genuinely competing.
      min-candidate-margin: ${AI_MIN_CANDIDATE_MARGIN:0.15}
      # A candidate at or above this still counts as "reasonably plausible".
      plausible-candidate-confidence: ${AI_PLAUSIBLE_CANDIDATE_CONFIDENCE:0.20}
      # Used by the evaluation harness to flag high-confidence wrong classifications, the
      # most dangerous failure mode.
      high-confidence: ${AI_HIGH_CONFIDENCE:0.85}

  openai:
    # Never committed — env-var-sourced only, same treatment as JWT_SECRET. Required only
    # when pronto.ai.mode=openai, and startup-checked there since Production MS4.
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout-ms: ${OPENAI_TIMEOUT_MS:10000}

  email:
    # log | ses. LIVE configuration as of Production MS1 -- this property used to exist and be read
    # by nothing at all, so setting it had no effect whatsoever. It now selects the EmailSender bean
    # (@ConditionalOnProperty on auth.email.LoggingEmailSender / auth.email.SesEmailSender).
    #
    #   log   write the message to the application log; the OTP itself is only included when
    #         pronto.environment=local. No real email is sent.
    #   ses   Amazon SES v2. Requires `from` below to be a verified SES identity and the account to
    #         be out of the SES sandbox for the target region.
    #
    # auth.config.ProviderModeStartupGuard refuses to start with mode=log in any environment other
    # than local/test/demo: undelivered verification codes would leave every account unreachable.
    mode: ${EMAIL_MODE:log}
    # Verified SES sender identity. Empty by default because there is no safe default -- required
    # (and startup-checked) only when mode=ses. Never a secret, so it lives here rather than in
    # Secrets Manager; the CREDENTIALS come from the AWS default provider chain / IAM role and
    # appear nowhere in this repository.
    from: ${EMAIL_FROM:}
    ses-region: ${EMAIL_SES_REGION:us-east-1}
    # Bounds the inline send on the registration/login request path. Without it an unresponsive
    # provider holds a request thread indefinitely.
    timeout-ms: ${EMAIL_TIMEOUT_MS:10000}

  sms:
    # log | aws. New in Production MS1 -- this application had no SMS capability before it.
    #
    #   log   as above: logged, code included only when pronto.environment=local.
    #   aws   AWS End User Messaging SMS, published via SNS (auth.sms.AwsSmsSender). Origination
    #         identity, sender ID registration and spend limits are account-level AWS configuration,
    #         not application configuration -- see the MS1 report §8 for the Israel-specific
    #         requirements.
    #
    # Same startup guard as email. Additionally, the guard refuses to start with mode=aws while the
    # demo dataset is enabled: the demo accounts' phone numbers are synthetic and may belong to real
    # people who did not ask to receive Pronto verification codes.
    mode: ${SMS_MODE:log}
    region: ${AWS_SMS_REGION:us-east-1}
    # Optional alphanumeric sender ID. Left empty AWS selects an origination identity from the
    # account's pool, which is the right default: several countries ignore or forbid alphanumeric
    # sender IDs, and a hardcoded one would silently degrade delivery there.
    sender-id: ${AWS_SMS_SENDER_ID:}
    timeout-ms: ${SMS_TIMEOUT_MS:10000}

  auth:
    # Must LOGIN present a one-time password in addition to the password itself?
    #
    #   true (the default, and the intended long-term rule)
    #       POST /api/auth/login checks the password and answers LOGIN_OTP with a challenge. The
    #       session is minted one step later, by POST /api/auth/login/otp, only once the code has
    #       been redeemed. "A password alone never yields a session" -- see auth.service.AuthService.
    #
    #   false (TEMPORARY, pre-user stage)
    #       POST /api/auth/login answers AUTHENTICATED with the same session a redeemed code would
    #       have produced. No challenge row is written, no code is generated, and neither SES nor SNS
    #       is called on the login path. AWS End User Messaging is still in the SMS sandbox with an
    #       exhausted monthly spend quota, so a phone second factor currently cannot be delivered at
    #       all; an undeliverable second factor is not security, it is a locked door with the key on
    #       the wrong side.
    #
    # WHAT false DOES NOT DO. It does not weaken anything else on the login path: the password is
    # still verified against its BCrypt hash, the account lockout counter still applies, the login
    # rate limiter (auth.security.AuthRateLimitInterceptor) is untouched, JWTs are issued and
    # validated identically, and every role/route guard is unchanged. It does not relax the
    # email-verified requirement -- an account that never confirmed its address still gets a
    # VERIFY_EMAIL challenge instead of a session. It does not remove or bypass any OTP machinery:
    # OtpService, both SmsSender implementations, SesEmailSender, the verification_codes table, the
    # verify/resend endpoints, the rate limits and every OTP test remain exactly as they were, and
    # registration's email verification is entirely unaffected. This is NOT anonymous access.
    #
    # DELIBERATELY NOT DERIVED FROM pronto.environment, unlike every other switch in this package.
    # Inferring the second factor from an environment name would make "which environment am I?"
    # decide "is authentication complete?". Only an explicit AUTH_OTP_REQUIRED=false reaches it.
    #
    # Accepts exactly 'true' or 'false'; anything else refuses the boot rather than guessing, and
    # the active mode is logged at startup as "Authentication OTP requirement: ENABLED|DISABLED".
    # See auth.config.AuthOtpPolicy. RE-ENABLING is one variable: AUTH_OTP_REQUIRED=true.
    otp-required: ${AUTH_OTP_REQUIRED:true}

  verification:
    # Must an account prove its PHONE NUMBER as well as its email address?
    #
    # true (the default, and the intended long-term rule)
    #     Both channels. Registration issues a phone code after the email one; a customer cannot
    #     create an issue, booking or SOS request until the phone is proved
    #     (users.service.ContactVerificationGuard); a professional is not discoverable at all
    #     (professionals.ProfessionalEligibility.PHONE_VERIFIED_JPQL). This platform sends a
    #     professional to a stranger's home and both sides must be reachable.
    #
    # false (TEMPORARY, production only, MS5)
    #     A verified email is sufficient. AWS End User Messaging production SMS access has not been
    #     approved for this account, so no code can reach an Israeli handset -- enforcing the rule
    #     would mean every new account registers, logs in, and is then permanently refused at the
    #     first real action. An unreachable requirement fails silently and reads as a bug.
    #
    # WHAT false DOES NOT DO. It does not weaken email verification, which stays mandatory under
    # both settings; it does not remove the SMS implementation, the phone column, the capture screen
    # or any test; and it does not write phone_verified = true for anybody. Accounts created while
    # it is false keep phone_verified = false, so setting this back to true asks exactly the right
    # people to prove exactly the right thing, with no migration and no code change.
    #
    # RE-ENABLING: set SMS_VERIFICATION_REQUIRED=true once AWS approves production SMS. Verify
    # pronto.sms.mode=aws and that an origination identity exists first -- turning the requirement
    # back on while delivery is still broken recreates the trap this setting was added to escape.
    sms-required: ${SMS_VERIFICATION_REQUIRED:true}

    # Must an account prove its EMAIL ADDRESS?
    #
    # true (the default, and the intended long-term rule)
    #     Registration dispatches an EMAIL_VERIFICATION code and returns no token; login refuses a
    #     session to an account that never redeemed one; a customer cannot create an issue, booking
    #     or SOS request until the address is proved; only a verified account may start a password
    #     reset. Email is the account identity, and this is the only proof that the address behind
    #     an account belongs to the person using it.
    #
    # false (TEMPORARY, closed beta, production only)
    #     AWS SES is still in the SANDBOX and Production Access has not been approved, so SES
    #     rejects every recipient address that has not itself been individually verified in the
    #     console. With the rule enforced, registration creates the account and then fails with
    #     OTP_DELIVERY_FAILED for every real user, and login re-issues the same undeliverable code
    #     forever. There is no way forward for anyone who is not already on the console allowlist.
    #
    # WHAT false DOES NOT DO. It does not write email_verified = true for anybody -- accounts
    # created while it is false keep email_verified = false, exactly as the SMS half keeps
    # phone_verified = false. It does not remove the EMAIL_VERIFICATION purpose, the verify/resend
    # endpoints, SesEmailSender, or any test. It does not touch login OTP (AUTH_OTP_REQUIRED owns
    # that), password verification, lockout, rate limiting or any route guard.
    #
    # IT IS A REAL RELAXATION, and it is worth naming: while this is false, an account's email
    # address is unproved, so a typo'd or someone else's address will reach the marketplace.
    # Accepted deliberately for the beta -- see auth.config.VerificationPolicy and
    # users.service.ContactVerificationGuard.
    #
    # NOTE: password reset still DELIVERS over SES, so it remains unusable in the sandbox
    # regardless of this setting. This flag only stops email_verified from being the thing that
    # blocks it.
    #
    # RE-ENABLING is one variable: EMAIL_VERIFICATION_REQUIRED=true, the moment SES Production
    # Access is approved. Accounts created during the beta are then correctly asked to verify at
    # their next login, through the VERIFY_EMAIL branch that already exists for an abandoned
    # registration. No migration, no backfill, no code change.
    email-required: ${EMAIL_VERIFICATION_REQUIRED:true}

  otp:
    # Server-side key for the HMAC that protects stored one-time passwords
    # (auth.service.OtpPepper). NOT a salt and not interchangeable with one: a 6-digit code has only
    # 1,000,000 possible values, so an unkeyed digest -- salted or not -- is brute-forceable per row
    # in milliseconds. Only a secret the database does not contain helps.
    #
    # Deliberately a DIFFERENT secret from pronto.jwt.secret: the two have different blast radii and
    # rotating one must not force rotating the other. Never written to the database, never logged.
    #
    # Local-dev-only default below. auth.config.ProductionHardeningStartupGuard refuses to start any
    # environment other than local/test/demo while this is still the placeholder, empty, or under 32
    # characters.
    pepper: ${OTP_PEPPER:local-dev-only-insecure-otp-pepper-please-override-via-OTP_PEPPER-env-var-before-any-real-deployment}

  maps:
    # ---------------------------------------------------------------------------------
    # Production MS2 -- the real geocoding/routing provider. See the maps package README
    # for the provider decision and docs/production-roadmap/reports/prod-MS2-report.md.
    # ---------------------------------------------------------------------------------
    #
    # fake | google
    #   fake    Offline and deterministic: real coordinates for the largest Israeli cities,
    #           a hash-derived offset within the city, and straight-line-times-a-detour-factor
    #           routing. Genuinely a function of real geometry -- so ordering, radius and
    #           threshold tests exercise the real comparison logic -- but it is not a road
    #           network and it reports trafficAware=false so nothing can mistake it for one.
    #   google  Google Maps Platform: Geocoding API + Routes API (computeRouteMatrix,
    #           routingPreference=TRAFFIC_AWARE).
    #
    # auth.config.ProviderModeStartupGuard refuses to start with mode=fake in any environment
    # other than local/test/demo. A Production instance running the fake provider would quote
    # confident distances and arrival times describing no real journey, silently and
    # convincingly -- which is exactly the defect this milestone exists to end.
    mode: ${MAPS_MODE:fake}
    # Never committed -- env-var-sourced only, same treatment as JWT_SECRET/OPENAI_API_KEY.
    # Required (and startup-checked) whenever mode is not 'fake'. The key needs BOTH the
    # Geocoding API and the Routes API enabled on it, and billing enabled on the project.
    api-key: ${MAPS_API_KEY:}
    # ISO 3166-1 alpha-2 region bias for geocoding. A bias, not a filter -- maps.PostalAddress
    # also appends the country to every query, which is the part that is not merely a hint.
    region: ${MAPS_REGION:il}
    # Language for the provider's own formatted-address strings. Diagnostic only: a geocoder's
    # rendering of an address NEVER overwrites the customer's own address text.
    language: ${MAPS_LANGUAGE:he}
    # Bounds a customer-facing request thread against an unresponsive provider, same reason
    # EMAIL_TIMEOUT_MS exists. Deliberately short: a listing that takes eight seconds to admit
    # it has no ETA is worse than one that says so in two.
    timeout-ms: ${MAPS_TIMEOUT_MS:4000}
    # ---- provider-call budget (roadmap §15: no N+1 routing explosion) ----
    # Origins per route-matrix request. Sized from Pronto's own pools rather than from the
    # provider ceiling: SOS contacts at most 8 (15 emergency) and expands to at most 40, and a
    # normal listing is pre-filtered by category/coverage/eligibility before anything is routed.
    matrix-batch-size: ${MAPS_MATRIX_BATCH_SIZE:25}
    # Hard cap on candidates routed for ONE listing or dispatch evaluation. Overflow is reported
    # as ETA-unavailable and LOGGED AT WARN -- a silent cap reads downstream as "these people
    # have no GPS", which is a completely different operational problem.
    max-routed-candidates: ${MAPS_MAX_ROUTED_CANDIDATES:50}
    # ---- caching (roadmap §16) ----
    # Two TTLs because the two facts age differently. Road distance between two points is
    # effectively constant, so re-asking is pure cost. A traffic-aware duration is a claim about
    # right now; caching one for hours would put back the very defect MS2 removes -- a confident
    # number that stopped being true. In-process only: no Redis, per roadmap §16.
    distance-cache-ttl-seconds: ${MAPS_DISTANCE_CACHE_TTL_SECONDS:86400}
    traffic-duration-cache-ttl-seconds: ${MAPS_TRAFFIC_CACHE_TTL_SECONDS:180}
    route-cache-max-entries: ${MAPS_ROUTE_CACHE_MAX_ENTRIES:5000}
    # How long a persisted geocoding result may be reused before the address is resolved again.
    # 30 days because GOOGLE MAPS PLATFORM'S TERMS RESTRICT RETENTION OF ITS GEOCODING CONTENT
    # -- an operational/legal bound, not a technical one, which is why it is a property. The
    # exact terms in force MUST be confirmed against live provider documentation before
    # production launch; see the MS2 report's provider-decision section.
    geocode-cache-max-age-days: ${MAPS_GEOCODE_CACHE_MAX_AGE_DAYS:30}

  location:
    # ---------------------------------------------------------------------------------
    # Production MS2 -- what Pronto considers a trustworthy position, and how close counts
    # as "arrived". Deliberately separate from pronto.maps.*: that block is about a vendor,
    # this one is about product rules. See maps.config.LocationProperties for the full
    # rationale on each figure -- every one is a judgement call about physical reality and
    # will need adjusting from operational evidence, which is why none of them is a constant
    # buried in a service.
    # ---------------------------------------------------------------------------------
    #
    # How recent a professional's fix must be to be used as a ROUTING ORIGIN. Evaluated
    # against BOTH the device's captured_at and the server's updated_at, taking the stricter --
    # so a client with a wrong (or dishonest) clock cannot make a stale fix look fresh.
    professional-freshness: ${LOCATION_PROFESSIONAL_FRESHNESS:10m}
    # Worst device-reported accuracy still usable for routing. Loose on purpose: half a
    # kilometre changes a 20-minute ETA by a minute or two, so this rejects only the genuinely
    # useless (coarse wifi/IP geolocation reporting kilometres), not honest GPS.
    max-accuracy-meters: ${LOCATION_MAX_ACCURACY_METERS:500}
    # ---- arrival verification (roadmap §22) ----
    # How close to the order's destination counts as arrived. 150 m from what actually happens:
    # professionals park where they can, the destination coordinate is a geocoder's idea of a
    # building, and a phone in a built-up street has tens of metres of error of its own. A 25 m
    # radius would reject honest arrivals constantly.
    arrival-radius-meters: ${LOCATION_ARRIVAL_RADIUS_METERS:150}
    # Much stricter than max-accuracy-meters above, because the question is different: routing
    # asks "roughly where are you", arrival asks "are you at this door". A fix whose own error
    # circle is wider than the geofence cannot answer that. Startup fails if this exceeds
    # arrival-radius-meters, which would make the geofence decorative.
    arrival-max-accuracy-meters: ${LOCATION_ARRIVAL_MAX_ACCURACY_METERS:100}
    # How recent the fix submitted WITH an arrival claim must be. Far tighter than the routing
    # freshness: this fix is not estimating something, it is the entire evidence for a claim
    # about where a person is right now. Generous for taking a fresh reading (seconds), far too
    # short to replay one captured at the address earlier in the day.
    arrival-max-age: ${LOCATION_ARRIVAL_MAX_AGE:2m}
    # Client clock skew tolerated on a device-supplied captured_at. Modest future skew is
    # clamped to now; a wildly future timestamp is refused as malformed rather than treated as
    # maximally fresh, which is the direction an attacker would push.
    max-clock-skew: ${LOCATION_MAX_CLOCK_SKEW:2m}

  phone:
    # CLDR region used to interpret phone numbers typed in local form, i.e. with no country code
    # (auth.service.PhoneNumberNormalizer). IL so an Israeli customer can type 050-1234567 exactly
    # as they would say it. A number written in full international form is unaffected.
    default-region: ${PHONE_DEFAULT_REGION:IL}

  security:
    # Comma-separated CIDR blocks whose X-Forwarded-For header may be trusted for rate-limiting
    # attribution (auth.security.ClientIpResolver). EMPTY BY DEFAULT, and that default is the safe
    # one AGAINST SPOOFING: with no entries the resolver uses the direct peer address and ignores
    # every X-Forwarded-For header, so a client cannot evade or misdirect rate limiting by forging
    # one.
    #
    # It is NOT safe behind a load balancer, which is the opposite problem: every request then
    # appears to come from the ALB and all users share a single rate-limit counter, capping
    # registration platform-wide. Set this to the load balancer's SUBNET CIDRs -- e.g.
    # TRUSTED_PROXIES=10.0.0.0/16 -- never its DNS name and never AWS's published public ranges.
    #
    # auth.config.ProductionHardeningStartupGuard refuses to start a production-like environment
    # that leaves this empty while behind-proxy is true. Production MS4 added the other half of that
    # check: every entry must be a CIDR block inside PRIVATE address space. The test that matters is
    # not "is this block narrow" but "can a stranger's packet arrive with a source address inside
    # it" -- 10.0.0.0/8 is wide and safe, while TRUSTED_PROXIES=0.0.0.0/0 (or a pasted public AWS
    # range) makes every client a trusted proxy and hands any caller the ability to evade the auth
    # rate limiter with one header, or to spend another user's bucket by naming their address.
    trusted-proxies: ${TRUSTED_PROXIES:}
    # Whether this deployment sits behind a reverse proxy / load balancer. Defaults to true because
    # the Pronto 1.0 target architecture is an AWS ALB; a deployment reached directly sets it to
    # false and thereby states that decision explicitly rather than leaving it inferred from an
    # empty TRUSTED_PROXIES.
    behind-proxy: ${BEHIND_PROXY:true}

  sos:
    # Pronto SOS (broadcast-and-choose urgent dispatch). Every value below is read only at the
    # moment an offer is created, then snapshotted onto the sos_offers row — so changing one
    # affects future offers and never rewrites the economics of an offer already in flight.
    # See sos.config.SosProperties for the full rationale on each.
    #
    # Pronto's cut, as a fraction of the VISIT-RELATED FEES ONLY (visit fee + SOS surcharge) —
    # never of the repair itself, which the platform takes nothing from. On a 250 ILS visit fee
    # this is 25 ILS. This is the defining rule of the business model; it is configuration
    # precisely so that changing it never requires a code change or a migration.
    commission-rate: ${SOS_COMMISSION_RATE:0.10}
    # Flat surcharge on top of the visit fee for an urgent call, to make dropping everything
    # worth the professional's while. Defaults to 50.00 to match bookings.service
    # .BookingsService's existing hardcoded SOS_SURCHARGE_AMOUNT, so both SOS paths quote the
    # same number today. Consolidating that constant onto this property is a flagged follow-up.
    visit-surcharge: ${SOS_VISIT_SURCHARGE:50.00}
    # How many ranked professionals are actually contacted. The structural answer to "do not
    # spam every professional in the database": matching may score hundreds, only this many are
    # ever sent an offer.
    candidate-pool-size: ${SOS_CANDIDATE_POOL_SIZE:8}
    emergency-candidate-pool-size: ${SOS_EMERGENCY_CANDIDATE_POOL_SIZE:15}
    # ---- the two SOS timers (MS3 lifecycle redesign) ----
    # They are deliberately not derived from one another. Coupling them is what used to make
    # "the scan finished" also mean "your offer is dead".
    #
    # There is deliberately NO customer-decision timer. There was one -- 10 minutes from the
    # first acceptance -- and it expired requests out from under customers who had real, still
    # valid options on screen. The customer's ability to choose now ends only when the customer
    # chooses, the customer cancels, or nothing is left that could happen (nobody accepted and no
    # outstanding offer can still be answered).
    #
    # 1. How long the platform keeps looking for NEW professionals, from activation. When it
    #    elapses the search stops widening and stops dispatching -- and nothing else: offers
    #    already sent stay answerable, candidates stay visible, the customer can still choose.
    scan-window-seconds: ${SOS_SCAN_WINDOW_SECONDS:600}
    # 2. How long ONE professional has to answer the offer THEY were sent, from the moment it
    #    reached them. Stored per offer, so somebody first contacted at minute 9 still has until
    #    minute 19 -- the scan window closing does not shorten it.
    offer-ttl-seconds: ${SOS_OFFER_TTL_SECONDS:600}
    # How long the selected professional has to confirm before the request expires. Deliberately
    # more generous than the windows above: they already said they were available, so this is
    # about them still being reachable, and "waiting for confirmation" is the worst screen a
    # customer with a burst pipe can be left on. Was hardcoded on SosService until the SOS
    # final-readiness pass; every other SOS deadline was already tunable per environment.
    confirmation-grace-seconds: ${SOS_CONFIRMATION_GRACE_SECONDS:180}
    # Geographic eligibility cap, compared against matching.EtaResult#distanceKm.
    #
    # PRODUCTION MS2 MADE THIS REAL. It used to be compared against a coarse
    # same-city/different-city approximation (8 km / 35 km against a 40 km ceiling), so it
    # behaved as a same-city preference rather than a radius. It is now compared against actual
    # road distance from the professional's fresh device position to the customer's geocoded
    # address, so 40.0 finally means 40 kilometres. The value itself is unchanged and the
    # lifecycle around it was not redesigned -- only the number being compared is now true.
    max-dispatch-radius-km: ${SOS_MAX_DISPATCH_RADIUS_KM:40.0}
    # ---- automatic search expansion ----
    # The search widens BY ITSELF on this cadence for as long as the scan window is open; there
    # is no customer-facing "scan again" control any more. The schedule lives on the request
    # (sos_requests.next_expansion_at) and is advanced by the same atomic statement that counts
    # the expansion, so it survives a refresh and cannot fire twice.
    expansion-interval-seconds: ${SOS_EXPANSION_INTERVAL_SECONDS:120}
    # How many times ONE request may widen. Four is how many 2-minute intervals fit inside the
    # 10-minute scan window (expansions fall due at 2, 4, 6 and 8 minutes). This is the bound on
    # fan-out: 8 professionals contacted initially, at most 40 in total. 0 disables expansion
    # entirely and restores single-wave dispatch.
    max-search-expansions: ${SOS_MAX_SEARCH_EXPANSIONS:4}
    # How many ADDITIONAL professionals each expansion may contact, as a running total on top of
    # everyone already offered this request. This is the dimension expansion actually moves:
    # matching ranks every eligible professional and truncates to the pool cap, so widening it
    # means "we asked further down the ranked list". Defaults give 8 contacted initially and at
    # most 24 in total.
    expansion-pool-increment: ${SOS_EXPANSION_POOL_INCREMENT:8}
    # The factor max-dispatch-radius-km is multiplied by per expansion step.
    #
    # PRODUCTION MS2: this was documented as an inert seam -- with an 8/35 km distance model it
    # changed nothing observable. It is now live. Expansion widens a genuine geographic radius:
    # level 1 reaches 60 km, level 2 90 km, and so on, against real road distances. The seam was
    # designed for exactly this swap and needed no change to the expansion flow itself.
    # 1 leaves the radius untouched.
    expansion-radius-multiplier: ${SOS_EXPANSION_RADIUS_MULTIPLIER:1.5}

server:
  port: ${SERVER_PORT:8080}
  # Production MS5. The ECS service runs ONE task and deploys by stopping it before starting the
  # replacement (minimumHealthyPercent=0), so every deploy interrupts whatever is in flight. Without
  # this, SIGTERM kills the JVM immediately and an in-progress registration -- which may already have
  # written a verification_codes row and be waiting on SES -- dies between the two. Graceful shutdown
  # stops the connector accepting new connections, lets the active requests finish, then exits.
  #
  # Requires the JVM to actually RECEIVE the signal: backend/Dockerfile's ENTRYPOINT uses `exec` so
  # java is PID 1. A shell holding PID 1 would swallow SIGTERM and this setting would do nothing.
  shutdown: graceful

  # NOT set: server.forward-headers-strategy. Left at Spring Boot's default of NONE, deliberately
  # and permanently. auth.security.ClientIpResolver parses X-Forwarded-For itself, and its entire
  # safety property is that request.getRemoteAddr() is the raw TCP peer -- it consults the header
  # only when that peer is inside pronto.security.trusted-proxies. Setting this to `native` or
  # `framework` installs Tomcat's RemoteIpValve, which REWRITES getRemoteAddr() from the very header
  # the resolver is trying to decide whether to trust. The peer would then be the client's public
  # address, which is not inside any private trusted block, so the resolver would take its
  # untrusted-peer branch and return that unverified attacker-supplied value for every request --
  # while every startup guard still passed. Rate limiting would be spoofable and nothing would say
  # so. See docs/production-roadmap/deployment-runbook.md.

logging:
  level:
    # Production MS1 (pre-DONE audit). The AWS SDK logs full request bodies at DEBUG. For SNS that
    # body is the SMS text, which contains the one-time password -- so a globally raised log level,
    # or a well-meant "let's see the AWS traffic", would silently start writing live OTPs to the
    # application log. Pinned here so that raising the root level cannot reach it.
    software.amazon.awssdk: WARN

management:
  endpoints:
    web:
      exposure:
        # Still only `health`. MS5 adds the liveness/readiness GROUPS below, which are sub-paths of
        # this same endpoint (/actuator/health/liveness, /actuator/health/readiness) and need no
        # further exposure. Nothing else -- /actuator/env, /actuator/configprops and /actuator/beans
        # would each hand a reader the resolved configuration this application spent MS4 refusing to
        # print.
        include: health
  endpoint:
    health:
      # Unauthenticated callers (the ALB, the ECS agent) get a bare {"status":"UP"} and the HTTP
      # status code, which is all a health check needs. Details -- including which indicator is
      # down and any database error text -- require authentication.
      show-details: when-authorized

      # Production MS5. On Spring Boot 3.3 the liveness/readiness groups are auto-configured ONLY
      # when a Kubernetes environment is detected. ECS is not Kubernetes, so without this flag
      # /actuator/health/liveness and /actuator/health/readiness return 404 and any health check
      # pointed at them fails permanently.
      probes:
        enabled: true

      group:
        # ---- readiness: "should the ALB send this task traffic?" ----------------------------
        # Includes `db`. Every meaningful request path in this application reads or writes
        # PostgreSQL, so a task that cannot reach RDS has nothing useful to serve and should be
        # taken out of the target group rather than returning 500s to customers.
        #
        # `readinessState` is Spring's own ACCEPTING_TRAFFIC/REFUSING_TRAFFIC signal, which flips to
        # REFUSING as soon as graceful shutdown begins -- so the ALB stops sending new requests at
        # the start of a deploy rather than at the end of it.
        readiness:
          include: readinessState,db

        # ---- liveness: "is this process broken beyond recovery?" -----------------------------
        # Deliberately NOT including `db`, and this is the whole reason the split exists. The ECS
        # container health check restarts the container when liveness fails. If liveness asked the
        # database, a sixty-second RDS failover or a brief network blip would kill a JVM that is
        # perfectly healthy and would have reconnected on its own -- and because Flyway runs at
        # startup and also needs the database, the replacement task would fail to boot too. A
        # transient dependency outage would become a crash loop.
        #
        # The same reasoning excludes OpenAI, Google Maps, SES and SNS. There are no health
        # indicators for them (verified: no HealthIndicator implementation exists in this codebase)
        # and none should be added -- an OpenAI outage must degrade issue classification, not
        # terminate the platform.
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

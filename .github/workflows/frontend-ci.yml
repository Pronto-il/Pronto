name: Frontend CI

# Triggers are deliberately unfiltered by path, and no longer restricted to pushes on main.
# Path filters meant a docs-only change produced no check run at all, which would deadlock a
# required status check on a PR that never reports one (proven on commits 18585b4 and
# e253c23, both zero check runs). Running the suite on every change is the simple, reliable
# behaviour and matches backend-ci.yml.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    # Explicit job name. This string is what GitHub reports as the check-run name and what
    # branch protection lists as a required status check. Without it the job id ("build")
    # is used, and both workflows reported the same indistinguishable "build" context.
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Added by Production MS4. The 6 vitest suites existed and had never run in CI — lint and
      # build alone cannot fail on a broken component, so a regression reached `main` unchallenged.
      - name: Test
        run: npm test

      - name: Build
        env:
          # Production MS4: `vite.config.ts` refuses to build a production bundle with no API
          # origin, because Vite inlines the value and an unset variable ships a bundle calling
          # localhost from every user's browser. CI is not a deployment, so this is a structurally
          # valid placeholder on a reserved example domain — never a real Pronto origin, and never
          # a value anything is deployed with.
          VITE_API_BASE_URL: https://api.pronto.example
        run: npm run build
